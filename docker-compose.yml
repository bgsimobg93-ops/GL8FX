version: "3.9"

services:
  # ── Python TradingAgents API ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ~/.tradingagents:/root/.tradingagents
    restart: unless-stopped

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - TRADING_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
